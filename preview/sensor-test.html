<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>センサーテスト｜ACROSS</title>
<style>
  :root { --bg:#05060f; --card:#11142a; --fg:#e8ecff; --dim:#8a93c4; --ok:#4ade80; --ng:#f87171; --ac:#60a5fa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; font-size:14px;
         padding: max(10px, env(safe-area-inset-top)) 10px 24px; }
  h1 { font-size:18px; margin:4px 0 8px; }
  .card { background:var(--card); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
  .card h2 { font-size:15px; margin:0 0 6px; display:flex; justify-content:space-between; align-items:center; }
  .badge { font-size:11px; padding:2px 8px; border-radius:99px; background:#333; color:var(--dim); }
  .badge.ok { background:#14532d; color:var(--ok); }
  .badge.ng { background:#4c1d1d; color:var(--ng); }
  .row { display:grid; grid-template-columns: 70px 1fr 64px; align-items:center; gap:6px; margin:3px 0; }
  .row b { font-variant-numeric: tabular-nums; text-align:right; }
  .bar { height:8px; background:#222844; border-radius:4px; position:relative; overflow:hidden; }
  .bar i { position:absolute; top:0; bottom:0; left:50%; background:var(--ac); }
  .mono { font-family: ui-monospace, monospace; font-size:12px; color:var(--dim); word-break:break-all; }
  .stage { display:flex; gap:12px; align-items:center; justify-content:space-around; margin-top:6px; }
  .scene { width:110px; height:110px; perspective:400px; }
  .cube { width:70px; height:70px; position:relative; margin:20px; transform-style:preserve-3d; }
  .cube div { position:absolute; width:70px; height:70px; border:2px solid var(--ac); background:rgba(96,165,250,.12);
              display:flex; align-items:center; justify-content:center; font-size:12px; }
  .up { width:110px; height:110px; border-radius:50%; border:2px solid #333a66; position:relative; }
  .up .arrow { position:absolute; left:50%; top:50%; width:4px; height:46px; background:var(--ok); transform-origin: 50% 0;
               margin-left:-2px; border-radius:2px; }
  .up span { position:absolute; width:100%; text-align:center; bottom:-18px; font-size:11px; color:var(--dim); }
  button { background:#1f2550; color:var(--fg); border:1px solid #333a66; border-radius:10px; padding:12px 6px; font-size:14px; }
  button:active { background:var(--ac); color:#000; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  #log { max-height:90px; overflow:auto; }
</style>
</head>
<body>
<h1>🛰️ センサーテスト</h1>
<div class="mono" id="env"></div>

<div class="card">
  <h2>① ジャイロ（回転の速さ °/秒）<span class="badge" id="gyroBadge">待機中</span></h2>
  <div class="row"><span>X(前後)</span><div class="bar"><i id="gxBar"></i></div><b id="gx">-</b></div>
  <div class="row"><span>Y(左右)</span><div class="bar"><i id="gyBar"></i></div><b id="gy">-</b></div>
  <div class="row"><span>Z(回す)</span><div class="bar"><i id="gzBar"></i></div><b id="gz">-</b></div>
  <div class="mono" id="gyroHz"></div>
</div>

<div class="card">
  <h2>② 端末の向き（傾き・方位）<span class="badge" id="oriBadge">待機中</span></h2>
  <div class="row"><span>α 方位</span><div class="bar"><i id="oaBar"></i></div><b id="oa">-</b></div>
  <div class="row"><span>β 前後</span><div class="bar"><i id="obBar"></i></div><b id="ob">-</b></div>
  <div class="row"><span>γ 左右</span><div class="bar"><i id="ogBar"></i></div><b id="og">-</b></div>
  <div class="mono" id="quat">クォータニオン: -</div>
  <div class="mono" id="compass">コンパス(絶対方位): -</div>
  <div class="stage">
    <div class="scene"><div class="cube" id="cube">
      <div style="transform:translateZ(35px)">前</div><div style="transform:rotateY(180deg) translateZ(35px)">後</div>
      <div style="transform:rotateY(90deg) translateZ(35px)">右</div><div style="transform:rotateY(-90deg) translateZ(35px)">左</div>
      <div style="transform:rotateX(90deg) translateZ(35px)">上</div><div style="transform:rotateX(-90deg) translateZ(35px)">下</div>
    </div></div>
    <div class="up"><div class="arrow" id="upArrow"></div><span>重力の向き（下）</span></div>
  </div>
</div>

<div class="card">
  <h2>③ 画面の向き <span class="badge" id="scrBadge">-</span></h2>
  <div>今の向き: <b id="scr">-</b></div>
  <div class="mono" id="log"></div>
  <div class="grid" style="margin-top:6px">
    <button onclick="lockOri('portrait')">縦で固定</button>
    <button onclick="lockOri('landscape')">横で固定</button>
    <button onclick="unlockOri()">固定解除</button>
  </div>
</div>

<div class="card">
  <h2>④ 振動 <span class="badge" id="hapBadge">-</span></h2>
  <div class="grid">
    <button onclick="hap('light')">短い・弱</button>
    <button onclick="hap('medium')">短い・中</button>
    <button onclick="hap('heavy')">短い・強</button>
    <button onclick="vib(800)">長い 0.8秒</button>
    <button onclick="pattern([150,100,150,100,150,300,500,200,500,200,500,300,150,100,150,100,150])">連続(SOS)</button>
    <button onclick="thrust()">逆噴射</button>
  </div>
  <div class="mono" id="hapMsg"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const Cap = window.Capacitor;
const P = (Cap && Cap.Plugins) || {};
$('env').textContent = 'Capacitor: ' + (Cap ? Cap.getPlatform() : 'なし') +
  ' / Haptics: ' + (P.Haptics ? 'あり' : 'なし') + ' / ScreenOrientation: ' + (P.ScreenOrientation ? 'あり' : 'なし');

function bar(id, v, max) { const el = $(id+'Bar'); const r = Math.max(-1, Math.min(1, v/max));
  el.style.left = (r < 0 ? 50 + r*50 : 50) + '%'; el.style.width = Math.abs(r)*50 + '%'; $(id).textContent = v.toFixed(1); }
function ok(id, t) { $(id).className = 'badge ok'; $(id).textContent = t; }
function ng(id, t) { $(id).className = 'badge ng'; $(id).textContent = t; }

// ① gyro + gravity
let gCount = 0, gLast = performance.now();
window.addEventListener('devicemotion', e => {
  const r = e.rotationRate;
  if (r && r.alpha != null) {
    bar('gx', r.beta || 0, 360); bar('gy', r.gamma || 0, 360); bar('gz', r.alpha || 0, 360);
    gCount++; ok('gyroBadge', '受信中');
  }
  const g = e.accelerationIncludingGravity;
  if (g && g.x != null) {
    // screen coords: gravity points "down" on screen
    const ang = Math.atan2(g.x, -g.y) * 180 / Math.PI; // 0 = straight down
    $('upArrow').style.transform = 'rotate(' + (-ang) + 'deg)';
  }
});
setInterval(() => { const now = performance.now(); const hz = gCount * 1000 / (now - gLast);
  $('gyroHz').textContent = '更新頻度: ' + hz.toFixed(0) + ' 回/秒'; gCount = 0; gLast = now; }, 1000);
setTimeout(() => { if ($('gyroBadge').textContent === '待機中') ng('gyroBadge', '値が来ない'); }, 3000);

// ② orientation + quaternion
function quat(a, b, g) { const d = Math.PI/180, _x=b*d/2, _y=g*d/2, _z=a*d/2;
  const cX=Math.cos(_x), cY=Math.cos(_y), cZ=Math.cos(_z), sX=Math.sin(_x), sY=Math.sin(_y), sZ=Math.sin(_z);
  return [ sX*cY*cZ - cX*sY*sZ, cX*sY*cZ + sX*cY*sZ, cX*cY*sZ + sX*sY*cZ, cX*cY*cZ - sX*sY*sZ ]; } // ZXY order (W3C)
window.addEventListener('deviceorientation', e => {
  if (e.alpha == null) return;
  bar('oa', e.alpha, 360); bar('ob', e.beta, 180); bar('og', e.gamma, 90);
  const q = quat(e.alpha, e.beta, e.gamma);
  $('quat').textContent = 'クォータニオン(x,y,z,w): ' + q.map(v => v.toFixed(3)).join(', ');
  $('cube').style.transform = 'rotateX(' + e.beta + 'deg) rotateY(' + (-e.gamma) + 'deg) rotateZ(' + e.alpha + 'deg)';
  ok('oriBadge', e.absolute ? '受信中(絶対)' : '受信中');
});
window.addEventListener('deviceorientationabsolute', e => {
  if (e.alpha != null) $('compass').textContent = 'コンパス(絶対方位): ' + (360 - e.alpha).toFixed(0) + '°（北=0°）';
});
setTimeout(() => { if ($('oriBadge').textContent === '待機中') ng('oriBadge', '値が来ない'); }, 3000);

// ③ screen orientation
function logOri(src, type) { $('scr').textContent = type; ok('scrBadge', '取得OK');
  const t = new Date().toLocaleTimeString(); $('log').innerHTML = t + ' ' + src + ': ' + type + '<br>' + $('log').innerHTML; }
async function readOri(src) {
  try { if (P.ScreenOrientation) { const o = await P.ScreenOrientation.orientation(); logOri(src, o.type); return; } } catch (err) {}
  logOri(src + '(web)', screen.orientation ? screen.orientation.type : (innerWidth > innerHeight ? 'landscape' : 'portrait'));
}
if (P.ScreenOrientation) P.ScreenOrientation.addListener('screenOrientationChange', o => logOri('変化', o.type));
else if (screen.orientation) screen.orientation.addEventListener('change', () => readOri('変化'));
readOri('起動時');
async function lockOri(o) { try { await P.ScreenOrientation.lock({ orientation: o }); readOri('固定'); } catch (err) { $('log').innerHTML = '固定失敗: ' + err + '<br>' + $('log').innerHTML; } }
async function unlockOri() { try { await P.ScreenOrientation.unlock(); readOri('解除'); } catch (err) {} }

// ④ haptics
const H = P.Haptics;
if (H) ok('hapBadge', '使える'); else ng('hapBadge', 'プラグインなし');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function msg(t) { $('hapMsg').textContent = t; }
async function hap(style) { try { await H.impact({ style: style.toUpperCase() }); msg('impact ' + style); } catch (err) { msg('失敗: ' + err); } }
async function vib(ms) { try { await H.vibrate({ duration: ms }); msg('vibrate ' + ms + 'ms'); } catch (err) { msg('失敗: ' + err); } }
async function pattern(p) { msg('パターン再生中…'); for (let i = 0; i < p.length; i++) {
  if (i % 2 === 0) { try { await H.vibrate({ duration: p[i] }); } catch (err) {} } await sleep(p[i]); } msg('パターン終了'); }
async function thrust() { msg('逆噴射！'); const steps = ['LIGHT','LIGHT','MEDIUM','MEDIUM','HEAVY','HEAVY','HEAVY'];
  for (let i = 0; i < steps.length; i++) { try { await H.impact({ style: steps[i] }); } catch (err) {} await sleep(140 - i*12); }
  try { await H.vibrate({ duration: 600 }); } catch (err) {} msg('逆噴射 終了'); }
</script>
</body>
</html>
